<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Phone Perc">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Phone Percussion</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; color: #ddd;
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* The app's own on-screen keyboard. Keys sound on touch-down, not on release. */
  #kb {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1;
    padding: 6px 2px calc(env(safe-area-inset-bottom) + 8px);
    background: #232325; touch-action: none;
  }
  .row { display: flex; height: 54px; }
  .row.inset { padding: 0 5%; }               /* middle row sits half a key in */
  .key { flex: 1 1 0; display: flex; padding: 5px 3px; box-sizing: border-box; }
  .cap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; background: #636366; color: #fff;
    font-size: 23px; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
  }
  .key.mod .cap { background: #3a3a3c; font-size: 16px; }
  .key.down .cap { background: #9a9aa0; }
  .key.mod.down .cap { background: #6e6e73; }

  /* "lock screen" button: top right, next to the real side button.
     Shown and hidden together with the keyboard. */
  #lockBtn {
    position: fixed; z-index: 1; touch-action: none;
    top: calc(env(safe-area-inset-top) + 8px); right: 4px;
    padding: 8px 6px;                         /* bigger touch area than the visible button */
  }
  #lockBtn .cap { padding: 10px 14px; font-size: 15px; background: #3a3a3c; border-radius: 8px; }
  #lockBtn.down .cap { background: #6e6e73; }

  /* Black standby screen: hold to start. */
  #standby { position: fixed; inset: 0; z-index: 2; background: #000; }
  #holdArea {
    position: absolute; inset: 0 0 64px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #holdHint { color: #2a2a2a; font-size: 14px; letter-spacing: 0.08em; }
  #holdBar { width: 0; height: 2px; margin-top: 14px; background: #333; }
  #standby.holding #holdBar { width: 60vw; background: #777; transition: width var(--hold) linear; }
  #standbyFooter {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; box-sizing: border-box; color: #2e2e2e; font-size: 12px;
  }
  #changePlayer { color: #3a3a3a; background: none; border: 0; font-size: 12px; padding: 12px 0; }

  /* Setup screen: choose your part. */
  #setup {
    position: fixed; inset: 0; z-index: 3; background: #111; overflow-y: auto;
    padding: 48px 24px; box-sizing: border-box; text-align: center;
  }
  #setup h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  #setup p { color: #999; font-size: 15px; line-height: 1.4; }
  #playerButtons button {
    display: block; width: 100%; max-width: 360px; margin: 12px auto; padding: 18px;
    font-size: 19px; color: #fff; background: #2a2a2a; border: 1px solid #444; border-radius: 12px;
  }
  .status { font-size: 14px !important; }
  #soundCheck { margin: 28px auto 0; max-width: 360px; color: #999; font-size: 15px; }
  #soundCheck summary { padding: 10px; cursor: pointer; }
  #soundCheck button {
    display: block; width: 100%; margin: 10px auto; padding: 14px; font-size: 16px;
    color: #ddd; background: #1d1d1d; border: 1px solid #3a3a3a; border-radius: 10px;
  }
  #silentRow {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 10px auto 0; padding: 12px 14px; text-align: left; color: #ddd; font-size: 16px;
    background: #1d1d1d; border: 1px solid #3a3a3a; border-radius: 10px;
  }
  #silentRow b { font-weight: 500; font-size: 13px; color: #999; }
  #silentToggle { width: 26px; height: 26px; flex: none; }
  .hint { font-size: 13px !important; color: #777 !important; margin: 8px 0 0; }
  .good { color: #6c6 !important; }
  .bad { color: #e77 !important; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="kb" class="hidden" aria-label="Keyboard"></div>
<div id="lockBtn" class="hidden" role="button" aria-label="Lock screen"><div class="cap">lock screen</div></div>

<div id="standby" class="hidden">
  <div id="holdArea">
    <div id="holdHint">hold to start</div>
    <div id="holdBar"></div>
  </div>
  <div id="standbyFooter">
    <span id="standbyInfo"></span>
    <button id="changePlayer">change part</button>
  </div>
</div>

<div id="setup">
  <h1>Phone Percussion</h1>
  <p>Choose your part:</p>
  <div id="playerButtons"></div>
  <p id="loadStatus" class="status"></p>
  <p id="offlineStatus" class="status">Checking offline status…</p>

  <details id="soundCheck">
    <summary>Sound check</summary>
    <p>Test 1 should beep. Test 2 should thump.</p>
    <button id="beepBtn">Test 1: beep</button>
    <button id="fileBtn">Test 2: sound file</button>
    <label id="silentRow">
      <span>Play sound in silent mode<br><b id="silentState"></b></span>
      <input type="checkbox" id="silentToggle" switch>
    </label>
    <p class="hint">Keep this ON. Turn it OFF only if Test 1 makes no sound while ON.</p>
    <p id="diag" class="status"></p>
  </details>
</div>

<script src="lib/p5.min.js"></script>
<script src="config.js"></script>
<script src="sketch.js"></script>
</body>
</html>
